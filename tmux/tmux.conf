#--- General Settings ---
#Use Ctrl-a instead of Ctrl-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

#Quality of life
set -g mouse off
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

#Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

#--- Terminal & Colors ---
#True color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g allow-passthrough on

#--- Keybindings ---
#Better split shortcuts
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

#Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

#Toggle maximize pane
bind m resize-pane -Z

#--- Vim Integration ---
#Vim-tmux-navigator integration
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

#Resize panes with prefix + hjkl
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

#--- Copy Mode (Vi style) ---
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection

#Cross-platform clipboard (macOS/Linux)
if-shell 'test "$(uname)" = "Darwin"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'

# --- UI / Status Bar ---
set -g status-position bottom
set -g status-justify centre
set -g status-style bg='#1e1e2e',fg='#cdd6f4'

#LEFT STATUS: Shows 'PREF' in red when Prefix is active, else Session Name in blue
set -g status-left-length 30
set -g status-left '#[bold]#{?client_prefix,#[bg=#f38ba8]#[fg=#1e1e2e] PREF ,#[bg=#89b4fa]#[fg=#1e1e2e] #S }#[fg=#1e1e2e,bg=#313244]'
set -g status-left '#[bold]#{?client_prefix,#[bg=#f38ba8]#[fg=#1e1e2e] PREF ,#[bg=#89b4fa]#[fg=#1e1e2e] #S }#[fg=#1e1e2e,bg=#313244]'

#RIGHT STATUS: Date and Time
set -g status-right '#[fg=#1e1e2e,bg=#313244]#[fg=#a6e3a1,bg=#1e1e2e] %Y-%m-%d #[fg=#1e1e2e,bg=#313244]#[fg=#f9e2af,bg=#1e1e2e] %H:%M '

#Window tabs formatting
set -g window-status-format '#[fg=#1e1e2e,bg=#313244]#[fg=#cdd6f4,bg=#313244] #I #W #[fg=#313244,bg=#1e1e2e]'
set -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa]#[fg=#1e1e2e,bg=#89b4fa] #I #W #[fg=#89b4fa,bg=#1e1e2e]'

#Pane borders & Messages
set -g pane-border-style fg='#313244'
set -g pane-active-border-style fg='#89b4fa'
set -g message-style bg='#313244',fg=#cdd6f4

#Window activity
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style fg=#f9e2af,bg=#313244

# Floating terminal toggle (Prefix + t)
bind-key t run-shell '
  exec >>/tmp/scratch.log 2>&1
  set -x
  cwd="#{pane_current_path}"
  echo "cwd=$cwd"
  if [ "$(tmux display-message -p "#S")" = "scratch" ]; then
    tmux detach-client
  else
    if tmux has-session -t scratch 2>/dev/null; then
      tmux send-keys -t scratch: "cd \"$cwd\" && clear" C-m
    fi
    tmux display-popup -w 80% -h 80% -E "tmux attach-session -t scratch || tmux new-session -s scratch -c \"$cwd\""
  fi
'
