name: nvim-config

on:
  push:
    paths: ['nvim/**', '.github/workflows/neovim.yml']
  pull_request:
    paths: ['nvim/**', '.github/workflows/neovim.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Link config
        run: |
          mkdir -p ~/.config
          ln -s "$GITHUB_WORKSPACE/nvim" ~/.config/nvim
          ln -sf "$GITHUB_WORKSPACE/nvim/lua/init.lua" "$GITHUB_WORKSPACE/nvim/init.lua"

      - name: Debug config
        run: |
          ls -la ~/.config/nvim/
          echo "Broken symlinks:"
          find "$GITHUB_WORKSPACE/nvim" -xtype l
          nvim --headless "+lua print(vim.fn.stdpath('config'))" +qa
          nvim --headless "+lua print(package.loaded.lazy ~= nil)" +qa

      - name: Bootstrap lazy.nvim
        run: nvim --headless +qa 2>&1 | tee bootstrap.log

      - name: Install plugins
        run: |
          nvim --headless "+Lazy! sync" +qa 2>&1 | tee sync.log
          if grep -qE "Failed|E[0-9]{3,4}:" sync.log; then exit 1; fi

      - name: Check startup
        run: |
          nvim --headless +qa 2>&1 | tee startup.log
          if [ -s startup.log ]; then
            echo "Startup produced output, treating as failure"
            exit 1
          fi
