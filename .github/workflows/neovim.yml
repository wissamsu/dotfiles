name: nvim-config

on:
  push:
    paths: ['nvim/**', '.github/workflows/neovim.yml']
  pull_request:
    paths: ['nvim/**', '.github/workflows/neovim.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Link config
        run: |
          mkdir -p ~/.config
          ln -s "$GITHUB_WORKSPACE/nvim" ~/.config/nvim

      - name: Install plugins
        run: |
          nvim --headless "+Lazy! sync" +qa 2>&1 | tee sync.log
          if grep -qiE "error|failed" sync.log; then exit 1; fi

      - name: Check startup
        run: |
          nvim --headless +qa 2>&1 | tee startup.log
          if [ -s startup.log ]; then
            echo "Startup produced output, treating as failure"
            exit 1
          fi
